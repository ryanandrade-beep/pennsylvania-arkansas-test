name: QA Pipeline – Karate – Pennsylvania Arkansas

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      karate_env:
        description: "Ambiente de execucao (staging | production | local)"
        required: false
        default: "staging"
      karate_tags:
        description: "Tags para filtrar cenarios (ex: @smoke, @regression)"
        required: false
        default: "@regression"

jobs:
  karate-tests:
    name: Karate API Tests — Pennsylvania Arkansas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Configurar timezone (America/Sao_Paulo)
        run: sudo timedatectl set-timezone America/Sao_Paulo 2>/dev/null || true

      - name: Resolver dependencias Maven
        run: mvn dependency:resolve -q

      - name: Criar run no Qase TMS
        id: qase_run
        run: |
          TAGS="${{ github.event.inputs.karate_tags || '@regression' }}"
          ENV="${{ github.event.inputs.karate_env || 'staging' }}"
          RUN_TITLE="[CI] Automated test - API - ${ENV} - $(date '+%d-%m-%Y %H:%M:%S')"
          PROJECT="${{ secrets.QASE_TESTOPS_PROJECT }}"
          TOKEN="${{ secrets.QASE_TESTOPS_API_TOKEN }}"

          CREATE_RESPONSE=$(curl -sS --request POST \
            --url "https://api.qase.io/v1/run/${PROJECT}" \
            --header "Token: ${TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"title\":\"${RUN_TITLE}\",\"is_autotest\":true}")

          RUN_ID=$(echo "$CREATE_RESPONSE" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')

          if [ -z "$RUN_ID" ]; then
            echo "ERRO: nao foi possivel criar o run no Qase."
            echo "Resposta: $CREATE_RESPONSE"
            exit 1
          fi

          echo "Run criado — ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Executar testes Karate
        run: |
          TAGS="${{ github.event.inputs.karate_tags || '@regression' }}"
          ENV="${{ github.event.inputs.karate_env || 'staging' }}"
          mvn test \
            -Dkarate.env=$ENV \
            -Dkarate.options="--tags $TAGS" \
            -DQASE_MODE=testops \
            -DQASE_TESTOPS_API_TOKEN="${{ secrets.QASE_TESTOPS_API_TOKEN }}" \
            -DQASE_TESTOPS_PROJECT="${{ secrets.QASE_TESTOPS_PROJECT }}" \
            -DQASE_TESTOPS_RUN_ID="${{ steps.qase_run.outputs.run_id }}"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          CONWAY_ZAPI_URL: ${{ secrets.CONWAY_ZAPI_URL }}
          CONWAY_TELEGRAM_URL: ${{ secrets.CONWAY_TELEGRAM_URL }}
          CONWAY_META_URL: ${{ secrets.CONWAY_META_URL }}
          BARLING_URL: ${{ secrets.BARLING_URL }}
          NEWPORT_URL: ${{ secrets.NEWPORT_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          ENTERPRISE_SECRET_KEY: ${{ secrets.ENTERPRISE_SECRET_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ZAPI_CHANNEL_ID: ${{ secrets.ZAPI_CHANNEL_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          META_CHANNEL_ID: ${{ secrets.META_CHANNEL_ID }}
          TRIAL_CHANNEL_ID: ${{ secrets.TRIAL_CHANNEL_ID }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          MESSAGE_ID: ${{ secrets.MESSAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Meta / WhatsApp
          META_TOKEN: ${{ secrets.META_TOKEN }}
          CATALOG_ID: ${{ secrets.CATALOG_ID }}
          BUSINESS_ID: ${{ secrets.BUSINESS_ID }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          TEMPLATE_NAME: ${{ secrets.TEMPLATE_NAME }}
          # Usuarios de administracao (apenas Ryan e Parceiro teste)
          ADMIN_USER_ID_RYAN: ${{ secrets.ADMIN_USER_ID_RYAN }}
          ADMIN_USER_ID_PARCEIRO: ${{ secrets.ADMIN_USER_ID_PARCEIRO }}

      - name: Fechar run no Qase TMS
        if: always() && steps.qase_run.outputs.run_id != ''
        run: |
          curl -sS --request POST \
            --url "https://api.qase.io/v1/run/${{ secrets.QASE_TESTOPS_PROJECT }}/${{ steps.qase_run.outputs.run_id }}/complete" \
            --header "Token: ${{ secrets.QASE_TESTOPS_API_TOKEN }}" \
            --header "accept: application/json" > /dev/null
          echo "Run ${{ steps.qase_run.outputs.run_id }} fechado no Qase."

      - name: Publicar relatorio Karate
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-reports
          path: target/karate-reports/
          retention-days: 30
